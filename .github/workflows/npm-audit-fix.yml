name: Monthly npm audit fix

on:
  schedule:
    # 03:00 UTC on the 1st of each month
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-audit-fix-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply npm audit fix
        run: npm audit fix --package-lock-only

      - name: Install repaired dependency graph
        run: npm ci

      - name: Validate repaired dependency graph
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm run audit:npm
          npm run audit:deps
          npm run build
          npm run shader:matrix
          npm run test:coverage
          npm run pack:check

      - name: Create maintenance GitHub App token
        id: maintenance_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PREP_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PREP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request
        id: create_pull_request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.maintenance_app_token.outputs.token }}
          commit-message: "chore: monthly npm audit fix"
          title: "chore: monthly npm audit fix"
          body: |
            Automated `npm audit fix --package-lock-only` run.
            Please review dependency changes and adjust if a forced upgrade is needed.
          branch: chore/npm-audit-fix
          delete-branch: true
          add-paths: |
            package-lock.json

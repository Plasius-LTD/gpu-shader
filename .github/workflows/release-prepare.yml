name: Release Prepare

on:
  workflow_call:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: string
      preid:
        description: "Pre-release id (for example beta or rc). Leave blank for stable."
        required: false
        type: string
      release_prep_app_client_id:
        description: "GitHub App client ID used to generate the release-prep installation token."
        required: true
        type: string
      base_branch:
        description: "Protected branch that must receive release metadata before publishing."
        required: false
        type: string
        default: main
      package_directory:
        description: "Directory containing the package.json to version."
        required: false
        type: string
        default: "."
      changelog_path:
        description: "CHANGELOG.md path to promote for this release."
        required: false
        type: string
        default: "CHANGELOG.md"
      tag_prefix:
        description: "Prefix for release tags, for example v or ui-foundry-core-v."
        required: false
        type: string
        default: "v"
      merge_timeout_seconds:
        description: "How long to wait for a release-prep PR to merge before failing."
        required: false
        type: string
        default: "1200"
    outputs:
      name:
        description: "npm package name"
        value: ${{ jobs.prepare.outputs.name }}
      version:
        description: "Prepared package version without leading v"
        value: ${{ jobs.prepare.outputs.version }}
      tag:
        description: "Prepared release tag"
        value: ${{ jobs.prepare.outputs.tag }}
      flags:
        description: "npm publish flags"
        value: ${{ jobs.prepare.outputs.flags }}
      published:
        description: "Whether this exact package version already exists on npm"
        value: ${{ jobs.prepare.outputs.published }}
      validation_commit_sha:
        description: "protected-main commit authorizing this validation workflow"
        value: ${{ jobs.prepare.outputs.validation_commit_sha }}
      release_commit_sha:
        description: "immutable package source commit bound to npm provenance and the release tag"
        value: ${{ jobs.resolve_release.outputs.release_commit_sha }}

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    outputs:
      name: ${{ steps.release.outputs.name }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      flags: ${{ steps.release.outputs.flags }}
      published: ${{ steps.release.outputs.published }}
      validation_commit_sha: ${{ steps.release.outputs.validation_commit_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create release-prep GitHub App token
        id: release_prep_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.release_prep_app_client_id }}
          private-key: ${{ secrets.RELEASE_PREP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.13.0'
          cache: 'npm'

      - name: Verify private artifact policy
        working-directory: ${{ inputs.package_directory }}
        run: npm run privacy:check

      - name: Prepare and land release metadata
        id: release
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
          PACKAGE_DIRECTORY: ${{ inputs.package_directory }}
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          MERGE_TIMEOUT_SECONDS: ${{ inputs.merge_timeout_seconds }}
          GH_TOKEN: ${{ steps.release_prep_app_token.outputs.token }}
          RELEASE_PREP_AUTH_TOKEN: ${{ steps.release_prep_app_token.outputs.token }}
        run: |
          set -euo pipefail

          if [ "${BASE_BRANCH}" != "main" ]; then
            echo "Release metadata may be prepared only for main." >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME:-}" != "${BASE_BRANCH}" ]; then
            echo "Run cd.yml from ${BASE_BRANCH}; release metadata must be prepared from the protected release branch." >&2
            exit 1
          fi
          if ! [[ "${MERGE_TIMEOUT_SECONDS}" =~ ^[0-9]+$ ]] || [ "${MERGE_TIMEOUT_SECONDS}" -lt 60 ] || [ "${MERGE_TIMEOUT_SECONDS}" -gt 1500 ]; then
            echo "merge_timeout_seconds must be an integer from 60 through 1500." >&2
            exit 1
          fi

          BRANCH_PROTECTED="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${BASE_BRANCH}" --jq '.protected')"
          if [ "${BRANCH_PROTECTED}" != "true" ]; then
            echo "${BASE_BRANCH} is not protected; release fails closed before metadata mutation." >&2
            exit 1
          fi
          ALLOW_AUTO_MERGE="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge')"
          if [ "${ALLOW_AUTO_MERGE}" != "true" ]; then
            echo "Repository auto-merge is disabled; release fails closed before metadata mutation." >&2
            exit 1
          fi

          AUTH_TOKEN="${RELEASE_PREP_AUTH_TOKEN}"
          git remote set-url origin "https://x-access-token:${AUTH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${BASE_BRANCH}" --tags
          git checkout -B "${BASE_BRANCH}" "origin/${BASE_BRANCH}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          PACKAGE_DIRECTORY="${PACKAGE_DIRECTORY%/}"
          if [ -z "${PACKAGE_DIRECTORY}" ]; then
            PACKAGE_DIRECTORY="."
          fi

          if [ "${PACKAGE_DIRECTORY}" = "." ]; then
            PACKAGE_JSON="package.json"
          else
            PACKAGE_JSON="${PACKAGE_DIRECTORY}/package.json"
          fi

          if [ ! -f "${PACKAGE_JSON}" ]; then
            echo "Package manifest not found: ${PACKAGE_JSON}" >&2
            exit 1
          fi

          NAME=$(PACKAGE_JSON_PATH="${PACKAGE_JSON}" node -p "const path = require('node:path'); const pkg = require(path.resolve(process.env.PACKAGE_JSON_PATH)); pkg.name || ''")
          CURRENT_VER=$(PACKAGE_JSON_PATH="${PACKAGE_JSON}" node -p "const path = require('node:path'); const pkg = require(path.resolve(process.env.PACKAGE_JSON_PATH)); pkg.version || ''")
          PRIVATE_PACKAGE=$(PACKAGE_JSON_PATH="${PACKAGE_JSON}" node -p "const path = require('node:path'); const pkg = require(path.resolve(process.env.PACKAGE_JSON_PATH)); String(Boolean(pkg.private))")

          if [ -z "${NAME}" ] || [ -z "${CURRENT_VER}" ]; then
            echo "${PACKAGE_JSON} must define package name and version." >&2
            exit 1
          fi

          if [ "${PRIVATE_PACKAGE}" = "true" ]; then
            echo "Cannot release private package ${NAME} from ${PACKAGE_JSON}." >&2
            exit 1
          fi

          query_npm_registry_value() {
            local package_spec="$1"
            local field="$2"
            local error_file="${RUNNER_TEMP}/release-prepare-npm-query.err"
            local value
            local status
            set +e
            value="$(npm view "${package_spec}" "${field}" --registry https://registry.npmjs.org 2>"${error_file}")"
            status=$?
            set -e
            if [ "${status}" -eq 0 ]; then
              printf '%s' "${value}"
              return 0
            fi
            if grep -Eq "E404|404 Not Found" "${error_file}"; then
              return 1
            fi
            echo "npm registry query failed for ${package_spec}; release preparation fails closed." >&2
            sed -n '1,40p' "${error_file}" >&2
            return 2
          }

          FILE="${CHANGELOG_PATH}"
          if [ ! -f "${FILE}" ]; then
            echo "CHANGELOG.md is required for release metadata preparation." >&2
            exit 1
          fi

          set +e
          REGISTRY_VER="$(query_npm_registry_value "${NAME}" version)"
          REGISTRY_STATUS=$?
          set -e
          if [ "${REGISTRY_STATUS}" -gt 1 ]; then
            exit 1
          fi
          TAG_VER=$(
            git tag -l "${TAG_PREFIX}*" |
              TAG_PREFIX="${TAG_PREFIX}" node -e '
          const fs = require("node:fs");
          const prefix = process.env.TAG_PREFIX || "v";
          const parse = (value) => {
            const trimmed = String(value || "").trim();
            if (!trimmed.startsWith(prefix)) return null;
            const version = trimmed.slice(prefix.length).replace(/\^\{\}$/, "");
            const [core, prerelease = ""] = version.split("-");
            const parts = core.split(".").map((part) => Number(part));
            if (parts.length !== 3 || parts.some((part) => !Number.isInteger(part) || part < 0)) {
              return null;
            }
            return { version, parts, prerelease };
          };
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              const diff = left.parts[index] - right.parts[index];
              if (diff !== 0) return diff;
            }
            if (left.prerelease === right.prerelease) return 0;
            if (!left.prerelease) return 1;
            if (!right.prerelease) return -1;
            return left.prerelease.localeCompare(right.prerelease, undefined, { numeric: true });
          };

          const versions = fs
            .readFileSync(0, "utf8")
            .split(/\r?\n/)
            .map(parse)
            .filter(Boolean)
            .sort(compare);

          process.stdout.write(versions.at(-1)?.version || "");
          '
          )

          case "${BUMP:-patch}" in
            major|minor|patch|none) ;;
            *)
              echo "Unknown bump type: ${BUMP}" >&2
              exit 1
              ;;
          esac

          if [ -n "${PREID:-}" ] && ! printf '%s' "${PREID}" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.-]*$'; then
            echo "Invalid pre-release id: ${PREID}" >&2
            exit 1
          fi

          CURRENT_TAG="${TAG_PREFIX}${CURRENT_VER}"
          set +e
          CURRENT_REGISTRY_VERSION="$(query_npm_registry_value "${NAME}@${CURRENT_VER}" version)"
          CURRENT_REGISTRY_STATUS=$?
          set -e
          case "${CURRENT_REGISTRY_STATUS}" in
            0)
              if [ "${CURRENT_REGISTRY_VERSION}" != "${CURRENT_VER}" ]; then
                echo "npm returned ${CURRENT_REGISTRY_VERSION}, expected ${CURRENT_VER}." >&2
                exit 1
              fi
              CURRENT_PUBLISHED="true"
              ;;
            1) CURRENT_PUBLISHED="false" ;;
            *) exit 1 ;;
          esac

          CURRENT_RELEASE_STATE="missing"
          if gh release view "${CURRENT_TAG}" >/dev/null 2>&1; then
            if [ "$(gh release view "${CURRENT_TAG}" --json isDraft --jq '.isDraft')" = "true" ]; then
              CURRENT_RELEASE_STATE="draft"
            else
              CURRENT_RELEASE_STATE="published"
            fi
          fi

          if [ "${BUMP}" = "none" ]; then
            TARGET_VER="${CURRENT_VER}"
          elif grep -Eq "^## (\[${CURRENT_VER}\]|${CURRENT_VER})( |$)" "${FILE}" && { [ "${CURRENT_PUBLISHED}" != "true" ] || [ "${CURRENT_RELEASE_STATE}" != "published" ]; }; then
            echo "Reusing already-prepared incomplete release version ${CURRENT_VER}."
            TARGET_VER="${CURRENT_VER}"
          else
            TARGET_VER=$(node -e '
          const [localVersion, registryVersion, tagVersion, bump, preid] = process.argv.slice(1);
          const clean = (value) => String(value || "").replace(/^v/, "").trim();
          const parse = (value) => {
            const [core] = clean(value).split("-");
            const parts = core.split(".").map((part) => Number(part));
            if (parts.length !== 3 || parts.some((part) => !Number.isInteger(part) || part < 0)) {
              throw new Error(`Invalid semver value: ${value}`);
            }
            return parts;
          };
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              const diff = left[index] - right[index];
              if (diff !== 0) return diff;
            }
            return 0;
          };

          const candidates = [localVersion, registryVersion, tagVersion].filter(Boolean).map(parse);
          let base = candidates[0];
          for (const candidate of candidates.slice(1)) {
            if (compare(candidate, base) > 0) base = candidate;
          }

          let next;
          switch (bump) {
            case "major":
              next = [base[0] + 1, 0, 0];
              break;
            case "minor":
              next = [base[0], base[1] + 1, 0];
              break;
            case "patch":
              next = [base[0], base[1], base[2] + 1];
              break;
            default:
              throw new Error(`Unknown bump type: ${bump}`);
          }

          let version = next.join(".");
          if (preid) {
            version = `${version}-${preid}.0`;
          }
          process.stdout.write(version);
          ' "${CURRENT_VER}" "${REGISTRY_VER}" "${TAG_VER}" "${BUMP}" "${PREID:-}")
            if [ "${PACKAGE_DIRECTORY}" = "." ]; then
              npm version "${TARGET_VER}" --ignore-scripts --no-git-tag-version --allow-same-version
            else
              npm version "${TARGET_VER}" --workspace "${PACKAGE_DIRECTORY}" --ignore-scripts --no-git-tag-version --allow-same-version
            fi
          fi

          TAG="${TAG_PREFIX}${TARGET_VER}"

          set +e
          TARGET_REGISTRY_VERSION="$(query_npm_registry_value "${NAME}@${TARGET_VER}" version)"
          TARGET_REGISTRY_STATUS=$?
          set -e
          case "${TARGET_REGISTRY_STATUS}" in
            0)
              if [ "${TARGET_REGISTRY_VERSION}" != "${TARGET_VER}" ]; then
                echo "npm returned ${TARGET_REGISTRY_VERSION}, expected ${TARGET_VER}." >&2
                exit 1
              fi
              PUBLISHED="true"
              ;;
            1) PUBLISHED="false" ;;
            *) exit 1 ;;
          esac

          if [ "${BUMP}" != "none" ] && [ "${PUBLISHED}" = "true" ]; then
            echo "${NAME}@${TARGET_VER} already exists on npm; cut a new version instead." >&2
            exit 1
          fi

          if [ "${BUMP}" != "none" ] && gh release view "${TAG}" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "${TAG}" --json isDraft --jq '.isDraft')"
            if [ "${IS_DRAFT}" != "true" ]; then
              echo "GitHub release ${TAG} is already published; cut a new version instead." >&2
              exit 1
            fi
          fi

          if ! grep -q "^## \[${TARGET_VER}\]" "${FILE}"; then
            UNREL_START=$(grep -nE '^## (\[Unreleased\]|Unreleased)( |$)' "${FILE}" | head -n 1 | cut -d: -f1 || true)
            if [ -z "${UNREL_START}" ]; then
              echo "No '## [Unreleased]' or '## Unreleased' section found in CHANGELOG.md." >&2
              exit 1
            fi

            DATE=$(date -u +%Y-%m-%d)
            VERSION_LINE="## [${TARGET_VER}] - ${DATE}"
            NEXT_HDR=$(awk 'NR>'"${UNREL_START}"' && /^## /{print NR; exit}' "${FILE}")
            if [ -z "${NEXT_HDR}" ]; then
              NEXT_HDR=$(wc -l < "${FILE}")
              NEXT_HDR=$((NEXT_HDR+1))
            fi

            HEADER=$(sed -n "1,${UNREL_START}p" "${FILE}")
            UNREL_CONTENT=$(sed -n "$((UNREL_START+1)),$((NEXT_HDR-1))p" "${FILE}")
            TAIL=$(sed -n "${NEXT_HDR},\$p" "${FILE}")

            NEW_UNRELEASED=$(printf '%s\n' \
              '' \
              '- **Added**' \
              '  - (placeholder)' \
              '' \
              '- **Changed**' \
              '  - (placeholder)' \
              '' \
              '- **Fixed**' \
              '  - (placeholder)' \
              '' \
              '- **Security**' \
              '  - (placeholder)')

            TMP_FILE=$(mktemp)
            {
              printf "%s\n" "${HEADER}"
              printf "%s\n\n" "${NEW_UNRELEASED}"
              printf "%s\n" "${VERSION_LINE}"
              if [ -z "$(echo "${UNREL_CONTENT}" | tr -d '\n' | tr -d '[:space:]')" ]; then
                printf "### Changed\n- (no notable changes)\n\n"
              else
                printf "%s\n" "${UNREL_CONTENT}"
                printf "\n"
              fi
              printf "%s\n" "${TAIL}"
            } > "${TMP_FILE}"

            mv "${TMP_FILE}" "${FILE}"

            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${TAG}...HEAD"
            awk -v repl="[Unreleased]: ${COMPARE_URL}" 'BEGIN{OFS=FS} { if ($0 ~ /^\[Unreleased\]: /) { print repl } else { print } }' "${FILE}" > "${FILE}.tmp"
            mv "${FILE}.tmp" "${FILE}"

            if ! grep -q "^\[${TARGET_VER}\]:" "${FILE}"; then
              echo "[${TARGET_VER}]: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "${FILE}"
            fi
          fi

          git add "${PACKAGE_JSON}"
          if [ -f package-lock.json ]; then
            git add package-lock.json
          fi
          if [ "${PACKAGE_DIRECTORY}" != "." ] && [ -f "${PACKAGE_DIRECTORY}/package-lock.json" ]; then
            git add "${PACKAGE_DIRECTORY}/package-lock.json"
          fi
          git add "${FILE}"

          if git diff --cached --quiet; then
            echo "Release metadata already exists on ${BASE_BRANCH} for ${TAG}."
          else
            git commit -m "chore: prepare release ${TAG}"

            BRANCH="release/${TAG}"
            git remote set-url origin "https://x-access-token:${RELEASE_PREP_AUTH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" || true
            git push --force-with-lease --set-upstream origin "HEAD:${BRANCH}"

            PR_TITLE="chore: prepare release ${TAG}"
            PR_BODY=$(cat <<EOF
          ## Summary
          - prepare \`${TAG}\` for publication from protected \`${BASE_BRANCH}\`
          - update package metadata to \`${TARGET_VER}\`
          - move the current \`Unreleased\` notes into \`${TARGET_VER}\`

          The CD workflow will continue only after this release metadata is present on \`${BASE_BRANCH}\` and exact-commit CI is green.
          EOF
            )

            PR_NUMBER="$(gh pr list --head "${BRANCH}" --base "${BASE_BRANCH}" --state open --json number --jq '.[0].number' || true)"
            if [ -n "${PR_NUMBER}" ] && [ "${PR_NUMBER}" != "null" ]; then
              gh pr edit "${PR_NUMBER}" --title "${PR_TITLE}" --body "${PR_BODY}"
            else
              PR_URL="$(gh pr create --base "${BASE_BRANCH}" --head "${BRANCH}" --title "${PR_TITLE}" --body "${PR_BODY}")"
              PR_NUMBER="$(gh pr view "${PR_URL}" --json number --jq '.number')"
            fi

            if ! gh pr merge "${PR_NUMBER}" --auto --squash --delete-branch; then
              echo "Auto-merge could not be enabled for release metadata PR #${PR_NUMBER}; release fails closed." >&2
              exit 1
            fi

            DEADLINE=$((SECONDS + MERGE_TIMEOUT_SECONDS))
            while [ "${SECONDS}" -lt "${DEADLINE}" ]; do
              STATE="$(gh pr view "${PR_NUMBER}" --json state --jq '.state')"
              if [ "${STATE}" = "MERGED" ]; then
                echo "Release metadata PR #${PR_NUMBER} merged."
                break
              fi
              if [ "${STATE}" = "CLOSED" ]; then
                echo "Release metadata PR #${PR_NUMBER} closed without merging." >&2
                exit 1
              fi
              sleep 10
            done

            STATE="$(gh pr view "${PR_NUMBER}" --json state --jq '.state')"
            if [ "${STATE}" != "MERGED" ]; then
              echo "Release metadata PR #${PR_NUMBER} did not merge within ${MERGE_TIMEOUT_SECONDS}s; release fails closed." >&2
              exit 1
            fi
          fi

          git fetch origin "${BASE_BRANCH}" --tags
          git checkout -B "${BASE_BRANCH}" "origin/${BASE_BRANCH}"

          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          MAIN_VERSION=$(PACKAGE_JSON_PATH="${PACKAGE_JSON}" node -p "const path = require('node:path'); const pkg = require(path.resolve(process.env.PACKAGE_JSON_PATH)); pkg.version || ''")
          if [ "${MAIN_VERSION}" != "${TARGET_VER}" ]; then
            echo "${BASE_BRANCH} has package version ${MAIN_VERSION}, expected ${TARGET_VER}." >&2
            exit 1
          fi

          if ! grep -q "^## \[${TARGET_VER}\]" "${FILE}"; then
            echo "${BASE_BRANCH} is missing ${FILE} release section ${TARGET_VER}." >&2
            exit 1
          fi

          set +e
          PACKAGE_REGISTRY_VERSION="$(query_npm_registry_value "${NAME}" version)"
          PACKAGE_REGISTRY_STATUS=$?
          set -e
          case "${PACKAGE_REGISTRY_STATUS}" in
            0) FLAGS="" ;;
            1) FLAGS="--access public" ;;
            *) exit 1 ;;
          esac

          EFFECTIVE_PREID="${PREID:-}"
          if [ -z "${EFFECTIVE_PREID}" ]; then
            EFFECTIVE_PREID=$(TARGET_VER="${TARGET_VER}" node -e '
          const version = process.env.TARGET_VER || "";
          const match = version.match(/^[0-9]+\.[0-9]+\.[0-9]+-([0-9A-Za-z][0-9A-Za-z.-]*)\.[0-9]+$/);
          process.stdout.write(match ? match[1] : "");
          ')
          fi

          if [ -n "${EFFECTIVE_PREID}" ]; then
            if [ -n "${FLAGS}" ]; then
              FLAGS="${FLAGS} --tag ${EFFECTIVE_PREID}"
            else
              FLAGS="--tag ${EFFECTIVE_PREID}"
            fi
          fi

          VALIDATION_COMMIT_SHA=$(git rev-parse HEAD)
          if ! [[ "${VALIDATION_COMMIT_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Protected-main validation commit is malformed." >&2
            exit 1
          fi

          {
            echo "name=${NAME}"
            echo "version=${TARGET_VER}"
            echo "tag=${TAG}"
            echo "flags=${FLAGS}"
            echo "published=${PUBLISHED}"
            echo "validation_commit_sha=${VALIDATION_COMMIT_SHA}"
          } >> "${GITHUB_OUTPUT}"

  resolve_release:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      release_commit_sha: ${{ steps.authority.outputs.release_commit_sha }}
    steps:
      - name: Checkout exact validation commit without credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.prepare.outputs.validation_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.13.0'

      - name: Verify private artifact policy
        working-directory: ${{ inputs.package_directory }}
        run: npm run privacy:check

      - name: Resolve immutable release source authority
        id: authority
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          BUMP: ${{ inputs.bump }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          PACKAGE_NAME: ${{ needs.prepare.outputs.name }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          PREPARED_PUBLISHED: ${{ needs.prepare.outputs.published }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VALIDATION_COMMIT_SHA: ${{ needs.prepare.outputs.validation_commit_sha }}
        run: |
          set -euo pipefail
          if [ "${BASE_BRANCH}" != "main" ] || ! [[ "${VALIDATION_COMMIT_SHA}" =~ ^[a-f0-9]{40}$ ]] || ! [[ "${PREPARED_PUBLISHED}" =~ ^(true|false)$ ]]; then
            echo "Release authority inputs are malformed." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "${VALIDATION_COMMIT_SHA}" ]; then
            echo "Release authority checkout differs from the exact validation commit." >&2
            exit 1
          fi

          RELEASE_COMMIT_SHA="${VALIDATION_COMMIT_SHA}"
          if [ "${PREPARED_PUBLISHED}" = "true" ]; then
            if [ "${BUMP}" != "none" ]; then
              echo "Published release recovery requires bump=none." >&2
              exit 1
            fi
            if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              echo "Published package ${PACKAGE_NAME}@${PACKAGE_VERSION} has no immutable ${RELEASE_TAG} tag; recovery fails closed." >&2
              exit 1
            fi

            RELEASE_COMMIT_SHA="$(
              node <<'NODE'
          const { resolvePublishedRelease } = require("./scripts/verify-npm-release.cjs");

          const expected = {
            packageName: process.env.PACKAGE_NAME,
            version: process.env.PACKAGE_VERSION,
            repository: process.env.EXPECTED_REPOSITORY,
            workflow: ".github/workflows/cd.yml",
          };
          resolvePublishedRelease(expected).then(
            (resolved) => process.stdout.write(resolved.commit),
            (cause) => {
              console.error(cause instanceof Error ? cause.message : String(cause));
              process.exitCode = 1;
            },
          );
          NODE
            )"
            if ! [[ "${RELEASE_COMMIT_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
              echo "Published npm provenance did not resolve one exact release commit." >&2
              exit 1
            fi

            TAG_COMMIT_SHA=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
            if [ "${TAG_COMMIT_SHA}" != "${RELEASE_COMMIT_SHA}" ]; then
              echo "Published npm provenance resolves to ${RELEASE_COMMIT_SHA}, but ${RELEASE_TAG} resolves to ${TAG_COMMIT_SHA}." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "${RELEASE_COMMIT_SHA}" "${VALIDATION_COMMIT_SHA}"; then
              echo "Published release commit ${RELEASE_COMMIT_SHA} is not reachable from protected ${BASE_BRANCH} at ${VALIDATION_COMMIT_SHA}." >&2
              exit 1
            fi
          fi

          if [ "${PREPARED_PUBLISHED}" != "true" ] && [ "${RELEASE_COMMIT_SHA}" != "${VALIDATION_COMMIT_SHA}" ]; then
            echo "An unpublished release cannot use different validation and release commits." >&2
            exit 1
          fi
          echo "release_commit_sha=${RELEASE_COMMIT_SHA}" >> "${GITHUB_OUTPUT}"
